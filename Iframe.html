<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Responsive con Autoplay</title>
  <style>
    body {
      margin: 0;
      padding: 0px;
      background-color: black;
      font-family: Arial, sans-serif;
    }

    /* Contenedor Adaptable */
    .video-container {
      width: 100%;
      max-width: 800px; /* Ancho máximo en pantallas grandes */
      aspect-ratio: 16 / 9; /* Proporción estándar 16:9 */
      margin: 0 auto; /* Centra el video */
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      overflow: hidden;
    }

    /* El iframe ocupa todo el tamaño del contenedor */
    .video-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <div class="video-container">
    <iframe 
      src="https://www.youtube.com/embed/Av5lNlCuoFo?autoplay=1&mute=1" 
      title="YouTube video player" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
